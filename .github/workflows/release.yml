name: Windows Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-build.txt
      - name: Check release version
        shell: pwsh
        run: |
          $version = (Get-Content -LiteralPath VERSION -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid VERSION' }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw 'Tag must exactly match v + VERSION'
          }
      - name: Install build tools
        run: python -m pip install -r requirements-build.txt
      - name: Compile source files
        run: python -m compileall -q core.py cli.py proxy.py mcp_server.py win_core.py hotkey.py png_util.py desktop tools tests
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Build and verify release
        run: python tools/make_release.py --build --no-extract
      - name: Preserve release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            release/PromptEnhancer-*-win64.zip
            release/SHA256SUMS.txt
            release/RELEASE_NOTES.md
          if-no-files-found: error
          retention-days: 14

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: release
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" \
            release/PromptEnhancer-*-win64.zip release/SHA256SUMS.txt \
            --verify-tag --title "Prompt Enhancer $RELEASE_TAG" \
            --notes-file release/RELEASE_NOTES.md
