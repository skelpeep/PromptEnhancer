name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Compile source files
        run: python -m compileall -q core.py cli.py proxy.py mcp_server.py win_core.py hotkey.py png_util.py desktop tools tests
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Windows desktop startup and shutdown
        if: runner.os == 'Windows'
        run: python tools/make_release.py --smoke-source
