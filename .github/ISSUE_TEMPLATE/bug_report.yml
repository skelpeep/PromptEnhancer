name: Bug report
description: Report a reproducible problem. Remove API keys and private text.
title: "[Bug]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the actual and expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include the affected app and use sample text without private information.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "App version, Windows version, source or executable, Python version if relevant"
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Relevant logs or screenshots
      description: Redact API keys, service credentials, private URLs and prompt history.
